name: PerBu
options:
  bundleIdPrefix: dev.eigenhand
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YHLVKSU86M
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PerBu:
    type: application
    platform: iOS
    sources:
      - path: PerBu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu
        PRODUCT_NAME: PerBu
        INFOPLIST_FILE: PerBu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PerBu/PerBu.entitlements
  PerBuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PerBuUITests
    dependencies:
      - target: PerBu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PerBu
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  PerBu:
    build:
      targets:
        PerBu: all
        PerBuUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PerBuUITests
    archive:
      config: Release
