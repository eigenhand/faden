name: Faden
options:
  bundleIdPrefix: dev.eigenhand
  # The source language is German: the keys in the string catalogues are the
  # German sentences themselves. That saves an artificial key scheme and keeps
  # the source readable — the price is that a change to the German sentence
  # changes the key and the translation has to be reassigned.
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YHLVKSU86M
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Faden:
    type: application
    platform: iOS
    sources:
      - path: Faden
    dependencies:
      # The system SQLite, for the document index. FTS5 is compiled into it on iOS, so
      # full-text search over the parsed documents costs this line and no dependency.
      - sdk: libsqlite3.tbd
    settings:
      base:
        # Stays "perbu", and that is not a leftover from the rename. The bundle ID
        # is the app's identity in App Store Connect and on every device it sits
        # on: a new one would be a new app — new TestFlight, testers to invite
        # again, and existing installations would get a second icon instead of an
        # update. The keychain group hangs on it too. An identifier is not a name;
        # nobody ever gets to see it.
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu
        PRODUCT_NAME: Faden
        INFOPLIST_FILE: Faden/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        # Without this the compiler emits no .stringsdata, and
        # `-exportLocalizations` finds nothing that is not already in the
        # catalogue. That is exactly why the error texts did not turn up after the
        # move to `String(localized:)`.
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Faden/Faden.entitlements
      # Only the archive is signed manually. The reason is not written down in Xcode,
      # so it stands here: no Apple account is registered on this machine, and the App
      # Store Connect API key cannot stand in for one. The key issues development
      # certificates and profiles happily — try automatic signing and the archive
      # succeeds, signed for development, which is not something that can be shipped.
      # For a distribution profile it answers "you haven't been given access to
      # cloud-managed distribution certificates". So the profile is made in the portal
      # by hand and named here.
      #
      # A profile names the certificates allowed to use it, so replacing the signing
      # certificate — a new Mac, an expiry — means making the profile again and
      # changing the name below. That is the price of this route, and it is written
      # down because the error it produces ("doesn't include signing certificate")
      # names the certificate and not the profile, and sends people looking in the
      # wrong place.
      # Debug stays automatic so that the simulator and the tests run untouched.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Faden App Store - (API)"
  # Fadens erste Unittests.
  #
  # There used to be only a UI test target, and that is why a decision like "on a
  # throttle, fall back to the slower model at once" could sit there wrong for years
  # unnoticed: it was written down nowhere that anybody had to read.
  FadenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FadenTests
    dependencies:
      - target: Faden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Faden.app/Faden"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FadenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FadenUITests
    dependencies:
      - target: Faden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Faden
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  Faden:
    build:
      targets:
        Faden: all
        FadenTests: [test]
        FadenUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FadenTests
        - FadenUITests
    archive:
      config: Release
