name: PerBu
options:
  bundleIdPrefix: dev.eigenhand
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YHLVKSU86M
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PerBu:
    type: application
    platform: iOS
    sources:
      - path: PerBu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu
        PRODUCT_NAME: PerBu
        INFOPLIST_FILE: PerBu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PerBu/PerBu.entitlements
      # Nur das Archiv signiert von Hand. Der Grund steht nicht in Xcode, also hier:
      # auf diesem Rechner ist kein Apple-Konto in Xcode hinterlegt, weshalb die
      # automatische Signierung kein Profil erneuern kann. Seit die App Group in den
      # Berechtigungen steht, reicht das alte zwischengespeicherte Profil nicht mehr.
      # Das benannte Profil wurde über die App-Store-Connect-API ausgestellt und liegt
      # lokal. Debug bleibt automatisch, damit Simulator und Tests unberührt laufen.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Faden App Store (API)"
  # Fadens erste Unittests.
  #
  # Bisher gab es nur ein UI-Testziel, und das ist der Grund, warum eine Entscheidung
  # wie „bei einer Drosselung sofort auf das langsamere Modell ausweichen" jahrelang
  # unbemerkt danebenliegen konnte: sie stand nirgends geschrieben, wo sie jemand
  # nachlesen musste.
  PerBuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PerBuTests
    dependencies:
      - target: PerBu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PerBu.app/PerBu"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PerBuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PerBuUITests
    dependencies:
      - target: PerBu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PerBu
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  PerBu:
    build:
      targets:
        PerBu: all
        PerBuTests: [test]
        PerBuUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PerBuTests
        - PerBuUITests
    archive:
      config: Release
