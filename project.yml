name: Faden
options:
  bundleIdPrefix: dev.eigenhand
  # Die Quellsprache ist Deutsch: die Schlüssel in den Stringkatalogen sind die
  # deutschen Sätze selbst. Das spart ein künstliches Schlüsselschema und hält
  # den Quelltext lesbar — der Preis ist, dass eine Änderung am deutschen Satz
  # den Schlüssel ändert und die Übersetzung neu zugeordnet werden muss.
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YHLVKSU86M
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Faden:
    type: application
    platform: iOS
    sources:
      - path: Faden
    settings:
      base:
        # Bleibt „perbu“, und das ist kein Rest vom Umbenennen. Die Bundle-ID
        # ist die Identität der App in App Store Connect und auf jedem Gerät, auf
        # dem sie liegt: eine neue wäre eine neue App — neues TestFlight, neu
        # einzuladende Tester, und bestehende Installationen bekämen ein zweites
        # Icon statt eines Updates. Daran hängt zudem die Schlüsselbundgruppe.
        # Eine Kennung ist kein Name; zu sehen bekommt sie niemand.
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu
        PRODUCT_NAME: Faden
        INFOPLIST_FILE: Faden/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        # Ohne das gibt der Compiler keine .stringsdata aus, und
        # `-exportLocalizations` findet nichts, was nicht schon im Katalog steht.
        # Genau daran lag es, dass die Fehlertexte nach dem Umstellen auf
        # `String(localized:)` nicht auftauchten.
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Faden/Faden.entitlements
      # Nur das Archiv signiert von Hand. Der Grund steht nicht in Xcode, also hier:
      # auf diesem Rechner ist kein Apple-Konto in Xcode hinterlegt, weshalb die
      # automatische Signierung kein Profil erneuern kann. Seit die App Group in den
      # Berechtigungen steht, reicht das alte zwischengespeicherte Profil nicht mehr.
      # Das benannte Profil wurde über die App-Store-Connect-API ausgestellt und liegt
      # lokal. Debug bleibt automatisch, damit Simulator und Tests unberührt laufen.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Faden App Store (API)"
  # Fadens erste Unittests.
  #
  # Bisher gab es nur ein UI-Testziel, und das ist der Grund, warum eine Entscheidung
  # wie „bei einer Drosselung sofort auf das langsamere Modell ausweichen" jahrelang
  # unbemerkt danebenliegen konnte: sie stand nirgends geschrieben, wo sie jemand
  # nachlesen musste.
  FadenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FadenTests
    dependencies:
      - target: Faden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Faden.app/Faden"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FadenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FadenUITests
    dependencies:
      - target: Faden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eigenhand.perbu.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Faden
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  Faden:
    build:
      targets:
        Faden: all
        FadenTests: [test]
        FadenUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FadenTests
        - FadenUITests
    archive:
      config: Release
