name: Tests

# Why this exists: 50 unit tests that until now only ran for whoever remembered them.
# A test nobody runs automatically is an assertion about the past.
#
# Why only the unit tests and not the UI tests: the latter need state on the device —
# a store with or without a provider, a seeded conversation — and they skip themselves
# when it is missing. On a fresh runner that would be twelve skips and three minutes
# of compute for nothing. They stay where they belong: by hand, before a release.
#
# macOS minutes count tenfold on private repos. Hence no runs for changes that do not
# touch the code, and an aborted earlier run as soon as a
# neuer Commit kommt.
#
# The Info.plist once stood in this list and does not belong in it. It looks like
# configuration but is behaviour: `UIUserInterfaceStyle = Light` stood in there and
# made the entire dark palette inert — a change no test in the world would have
# caught if no test had run.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unittests
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # In the log, so that a failure caused by the toolchain does not look like one
      # in the code. The image carries several Xcodes; the default is 26.6, and that
      # is exactly what this run was checked against.
      - name: Werkzeugkette melden
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: xcodegen einrichten
        run: brew install --quiet xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      # `OS=latest` and not a fixed number: the image carries three runtimes, and
      # without a version xcodebuild fails with a misleading "My Mac" error, because
      # the device name is ambiguous. A fixed version would be the same problem in a
      # few months, only the other way round.
      # Runs before the tests, because in one second it says what the test run does
      # not see: Xcode enters new strings into the catalogue by itself while
      # building — untranslated, and without anything turning red.
      - name: Uebersetzungen vollstaendig
        run: ./check-localizations.py

      - name: Unittests
        run: |
          xcodebuild test \
            -project Faden.xcodeproj \
            -scheme Faden \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build/dd \
            -only-testing:FadenTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Testbericht aufheben
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/dd/Logs/Test/*.xcresult
          retention-days: 7
