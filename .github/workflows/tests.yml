name: Tests

# Warum es das gibt: 50 Unittests, die bisher nur lief, wer daran dachte. Ein Test,
# den niemand automatisch ausführt, ist eine Behauptung über die Vergangenheit.
#
# Warum nur die Unittests und nicht die UI-Tests: Letztere brauchen einen Zustand auf
# dem Gerät — eine Ablage mit oder ohne Anbieter, eine eingespielte Unterhaltung —,
# und sie überspringen sich selbst, wenn er fehlt. Auf einem frischen Läufer wären
# das zwölf Übersprungene und drei Minuten Rechenzeit für nichts. Sie bleiben, wo sie
# hingehören: von Hand, vor einem Release.
#
# macOS-Minuten zählen bei privaten Repos zehnfach. Deshalb keine Läufe für
# Änderungen, die den Code nicht anfassen, und ein abgebrochener Vorlauf, sobald ein
# neuer Commit kommt.
#
# Das Info.plist stand einmal in dieser Liste und gehört nicht hinein. Es sieht aus
# wie Konfiguration, ist aber Verhalten: Dort stand `UIUserInterfaceStyle = Light`
# und hat die gesamte dunkle Farbpalette wirkungslos gemacht — eine Änderung, die
# kein Test der Welt bemerkt hätte, wenn kein Test gelaufen wäre.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unittests
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # Steht im Protokoll, damit ein Fehlschlag, der an der Werkzeugkette liegt,
      # nicht wie einer im Code aussieht. Das Abbild bringt mehrere Xcodes mit; die
      # Voreinstellung ist 26.6, und genau damit ist dieser Lauf hier geprüft worden.
      - name: Werkzeugkette melden
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: xcodegen einrichten
        run: brew install --quiet xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      # `OS=latest` und keine feste Zahl: das Abbild führt drei Laufzeiten mit, und
      # ohne Angabe bricht xcodebuild mit einem irreführenden „My Mac"-Fehler ab,
      # weil der Gerätename mehrdeutig ist. Eine feste Version wäre dasselbe Problem
      # in ein paar Monaten, nur andersherum.
      # Laeuft vor den Tests, weil er in einer Sekunde sagt, was der Testlauf
      # nicht sieht: Xcode traegt neue Strings beim Bauen von selbst in den
      # Katalog ein — ohne Uebersetzung, und ohne dass irgendetwas rot wird.
      - name: Uebersetzungen vollstaendig
        run: ./check-localizations.py

      - name: Unittests
        run: |
          xcodebuild test \
            -project Faden.xcodeproj \
            -scheme Faden \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build/dd \
            -only-testing:FadenTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Testbericht aufheben
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/dd/Logs/Test/*.xcresult
          retention-days: 7
